name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            platforms;android-36
            build-tools;35.0.0
            build-tools;36.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: EXPO_USE_COMMUNITY_AUTOLINKING=1 npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
        env:
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lablens-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk